# rd.vmurome.ru — nginx server block
# Поместить в /usr/local/fastpanel2-nginx/vhosts/rd.vmurome.ru.conf
# Перезагрузить: sudo systemctl reload fastpanel2-nginx

server {
    listen 80;
    listen 443 ssl;
    server_name rd.vmurome.ru;

    ssl_certificate     /var/www/httpd-cert/vmurome.ru-wildcard.crt;
    ssl_certificate_key /var/www/httpd-cert/vmurome.ru-wildcard.key;

    root /var/www/rd.vmurome.ru;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/rd.vmurome.ru-access.log;
    error_log  /var/log/nginx/rd.vmurome.ru-error.log;
}
